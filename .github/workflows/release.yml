name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: The tag matches the version in Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match Cargo.toml version $v" }
          if (-not (Test-Path "docs\release-notes\${{ github.ref_name }}.md")) { throw "docs\release-notes\${{ github.ref_name }}.md is missing" }
      - name: Format, lint, test, build, package
        shell: pwsh
        run: .\scripts\release.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist\Harbor-Setup.exe dist\Harbor.exe dist\SHA256SUMS.txt --title "Harbor $("${{ github.ref_name }}".TrimStart('v'))" --notes-file "docs\release-notes\${{ github.ref_name }}.md"
