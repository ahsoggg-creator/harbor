[package]
name = "harbor"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ahsoggg-creator/harbor"
description = "Harbor: download, update and manage all your GitHub projects in one window"

[[bin]]
name = "Harbor"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
